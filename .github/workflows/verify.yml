name: Discord Auto Verifier

on:
  # 1. Allows triggering via cron-job.org API or manual click in GitHub UI
  workflow_dispatch:
  # 2. Built-in GitHub schedule backup
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: discord-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (Skip Chrome download, use pre-installed Chrome)
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm install --omit=dev

      - name: Run Discord Verifier
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
        run: node server.js